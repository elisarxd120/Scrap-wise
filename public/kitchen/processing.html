<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Status - Scrap-Wise</title>
    <link rel="stylesheet" href="/kitchen/kitchen.css">
  </head>
  <body>
    <div id="kitchen-nav"></div>
    <main class="kitchen-main">
      <header class="page-header">
        <div><p class="eyebrow">Waste workflow</p><h1>Processing Status</h1></div>
        <a class="help-button" href="/kitchen/guide#processing" aria-label="Processing help">?</a>
      </header>
      <div class="low-stock-banner hidden" data-low-stock-banner>Warning: one or more kitchen items are at or below the reorder level.</div>
      <section class="kitchen-card">
        <div class="toolbar">
          <label><span>Processing date</span><input id="processing-date" type="date"></label>
        </div>
        <p class="message hidden" id="processing-message"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Reading</th><th>Device</th><th>Weight</th><th>Status</th><th>Before</th><th>After</th><th>Action</th></tr></thead>
            <tbody id="processing-table"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <div class="toast hidden" id="toast" role="status"></div>
    <script src="/kitchen/nav.js"></script>
    <script src="/kitchen/processing.js"></script>
  </body>
</html>
