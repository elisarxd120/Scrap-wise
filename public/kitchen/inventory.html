<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Scrap-Wise</title>
    <link rel="stylesheet" href="/kitchen/kitchen.css">
  </head>
  <body>
    <div id="kitchen-nav"></div>
    <main class="kitchen-main">
      <header class="page-header">
        <div><p class="eyebrow">Current stock</p><h1>Inventory</h1></div>
        <a class="help-button" href="/kitchen/guide#inventory" aria-label="Inventory help">?</a>
      </header>
      <div class="low-stock-banner hidden" data-low-stock-banner>Warning: one or more kitchen items are at or below the reorder level.</div>
      <section class="kitchen-card">
        <div class="toolbar">
          <label><span>Search</span><input id="inventory-search" type="search" placeholder="Item, category, or unit"></label>
          <label><span>Category</span><select id="category-filter"><option value="">All categories</option></select></label>
          <label class="toggle-label"><input id="low-only" type="checkbox"> Low stock only</label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>Category</th><th>Unit</th><th>On Hand</th><th>Reorder Level</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="inventory-table"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <div class="toast hidden" id="toast" role="status"></div>
    <script src="/kitchen/nav.js"></script>
    <script src="/kitchen/inventory.js"></script>
  </body>
</html>
