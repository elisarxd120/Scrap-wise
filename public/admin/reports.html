<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - Scrap-Wise</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="admin-nav"></div>
    <main class="admin-main">
      <header class="page-header">
        <div><p class="eyebrow">Validated Exports</p><h1>Reports</h1></div>
      </header>
      <section class="admin-card">
        <div class="toolbar filter-toolbar">
          <label class="search-box"><span>Report</span><select id="report-type"><option value="sales">Sales Summary</option><option value="transactions">Transactions</option><option value="inventory">Inventory Snapshot</option><option value="waste">Waste Summary</option><option value="payroll">Payroll</option></select></label>
          <label class="search-box"><span>From</span><input id="report-start" type="date" /></label>
          <label class="search-box"><span>To</span><input id="report-end" type="date" /></label>
          <button class="button primary" id="generate-report" type="button">Generate</button>
          <button class="button secondary" id="export-report" type="button">Export CSV</button>
        </div>
        <p class="form-message error" id="report-error"></p>
      </section>
      <section class="admin-card movement-section">
        <header class="card-heading"><h2 id="report-title">Report Preview</h2><span id="report-meta"></span></header>
        <div class="table-wrap"><table><thead id="report-head"></thead><tbody id="report-body"><tr><td class="empty">Generate a report to preview it.</td></tr></tbody></table></div>
      </section>
    </main>
    <div class="toast hidden" id="toast"></div>
    <script src="/admin/nav.js"></script>
    <script src="/admin/reports.js"></script>
  </body>
</html>
