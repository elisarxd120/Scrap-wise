<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory - Scrap-Wise</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="admin-nav"></div>
    <main class="admin-main">
      <header class="page-header">
        <div>
          <p class="eyebrow">Stock Management</p>
          <h1>Inventory</h1>
        </div>
        <button class="button primary" id="add-item" type="button">
          + Add Item
        </button>
      </header>
      <section class="admin-card">
        <div class="toolbar">
          <label class="search-box"
            ><span>Search Items</span
            ><input
              id="item-search"
              type="search"
              placeholder="Name, category, or unit"
          /></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Quantity</th>
                <th>Reorder Level</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-table">
              <tr>
                <td colspan="7" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="admin-card movement-section">
        <header class="card-heading">
          <h2>Stock Movements</h2>
          <button class="button primary" id="add-movement" type="button">
            + Record Movement
          </button>
        </header>
        <div class="toolbar filter-toolbar">
          <label class="search-box">
            <span>View by</span>
            <select id="movement-date-mode">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </label>
          <label class="search-box">
            <span id="movement-date-label">Selected day</span>
            <input id="movement-date-filter" type="date" />
          </label>
          <label class="search-box"
            ><span>Filter by Item</span
            ><select id="movement-item-filter">
              <option value="">All items</option>
            </select></label
          >
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Date</th>
                <th>Reason</th>
                <th>Recorded By</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="movement-table">
              <tr>
                <td colspan="7" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <div class="modal hidden" id="item-modal">
      <div class="modal-card">
        <header>
          <h2 id="item-modal-title">Add Item</h2>
          <button class="modal-close" data-close="item-modal" type="button">
            ×
          </button>
        </header>
        <form id="item-form">
          <div class="form-grid">
            <div class="field">
              <label for="item_name">Item Name</label
              ><input id="item_name" name="name" required />
            </div>
            <div class="field">
              <label for="item_category">Category</label
              ><input id="item_category" name="category" required />
            </div>
            <div class="field">
              <label for="item_unit">Unit</label
              ><input
                id="item_unit"
                name="unit"
                placeholder="kg, liters, pieces"
                required
              />
            </div>
            <div class="field">
              <label for="item_quantity">Quantity on Hand</label
              ><input
                id="item_quantity"
                name="quantity"
                type="number"
                min="0"
                step="0.01"
                value="0"
                required
              />
            </div>
            <div class="field">
              <label for="item_reorder">Reorder Level</label
              ><input
                id="item_reorder"
                name="reorder_level"
                type="number"
                min="0"
                step="0.01"
                value="0"
                required
              />
            </div>
          </div>
          <p class="form-message error" id="item-error"></p>
          <footer>
            <button
              class="button secondary"
              data-close="item-modal"
              type="button"
            >
              Cancel</button
            ><button class="button primary" type="submit">Save Item</button>
          </footer>
        </form>
      </div>
    </div>
    <div class="modal hidden" id="movement-modal">
      <div class="modal-card">
        <header>
          <h2 id="movement-modal-title">Record Stock Movement</h2>
          <button class="modal-close" data-close="movement-modal" type="button">
            ×
          </button>
        </header>
        <form id="movement-form">
          <div class="form-grid">
            <div class="field">
              <label for="movement_item">Item</label
              ><select id="movement_item" name="item_id" required></select>
            </div>
            <div class="field">
              <label for="movement_type">Movement Type</label
              ><select id="movement_type" name="movement_type" required>
                <option value="in">Stock-In</option>
                <option value="out">Stock-Out</option>
              </select>
            </div>
            <div class="field">
              <label for="movement_quantity">Quantity</label
              ><input
                id="movement_quantity"
                name="quantity"
                type="number"
                min="0.01"
                step="0.01"
                required
              />
            </div>
            <div class="field">
              <label for="movement_date">Date</label
              ><input
                id="movement_date"
                name="movement_date"
                type="date"
                required
              />
            </div>
            <div class="field">
              <label for="movement_reason">Reason</label
              ><input
                id="movement_reason"
                name="reason"
                placeholder="Delivery, spoilage, usage..."
              />
            </div>
          </div>
          <p class="form-message error" id="movement-error"></p>
          <footer>
            <button
              class="button secondary"
              data-close="movement-modal"
              type="button"
            >
              Cancel</button
            ><button class="button primary" type="submit">Save Movement</button>
          </footer>
        </form>
      </div>
    </div>
    <div class="toast hidden" id="toast"></div>
    <script src="/admin/nav.js"></script>
    <script src="/admin/inventory.js"></script>
  </body>
</html>
